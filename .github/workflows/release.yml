name: 'Release Matrix Build'

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

          - platform: 'macos-latest'
            args: ''

          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖 (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 清理预存二进制 (确保不将 cloudflared 预打包进安装包)
        run: |
          node -e "const fs = require('fs'); ['binaries', 'src-tauri/binaries'].forEach(d => { if (fs.existsSync(d)) fs.rmSync(d, { recursive: true, force: true }); });"

      - name: 构建 Tauri 应用程序并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cloudflare Tunnel GUI ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Cloudflare Tunnel GUI Release ${{ github.ref_name }}

            基于 Tauri 2.0 + Vue 3 + Windows 11 Fluent Design 构建的跨平台极简 Cloudflare 隧道管理客户端。

            ### 📦 支持平台与安装包格式：
            - **Windows**: `.exe` (NSIS 轻量级安装包), `.msi` (MSI 企业安装包)
            - **macOS**: `.dmg` (磁盘镜像), `.app`
            - **Linux**: `.AppImage` (免安装便携版), `.deb` (Debian/Ubuntu 安装包)

            *(软件内已内置跨平台自动下载器，首次运行点击即可极速在线获取最新版官方 cloudflared)*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
